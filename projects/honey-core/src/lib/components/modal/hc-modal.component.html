@if (open) {
  <div class="hc-modal-backdrop" (click)="onBackdropClick()">
    <section
      [class]="classes"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title || 'Modal'"
      (click)="$event.stopPropagation()"
    >
      <header class="hc-modal__header">
        <div class="hc-modal__heading">
          @if (title) {
            <h2 class="hc-modal__title">{{ title }}</h2>
          }

          @if (description) {
            <p class="hc-modal__description">{{ description }}</p>
          }
        </div>

        @if (dismissible) {
          <button class="hc-modal__close" type="button" aria-label="Fechar modal" (click)="onCloseClick()">
            ×
          </button>
        }
      </header>

      <div class="hc-modal__body">
        <ng-content />
      </div>

      <footer class="hc-modal__footer">
        <ng-content select="[modal-actions]"></ng-content>
      </footer>
    </section>
  </div>
}
